name: Lean development
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: Run all default environment linters
        run: lake env lean -DwarningAsError=true scripts/Lint.lean
      - name: Check blueprint and source scope
        run: python3 scripts/check_blueprint.py
      - name: Audit implemented theorem axioms
        run: python3 scripts/check_axioms.py
