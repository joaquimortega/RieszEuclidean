fidelity:
  divergences: No alternate lattice proof is substituted for the Euclidean proof. The basis predicate
    uses actual restricted Lebesgue L² and exp(2πi inner(ξ,x)). Mathlib conjugates the first inner-product
    argument. Hull compactness uses Hausdorff limits on compact Euclidean windows and countable
    extended-distance probes instead of counting-measure extraction. The lemma and its exact
    Beurling convergence topology are preserved. Vague-convergence equivalence is proved
    using finite point matchings, compactly supported distinguishing bumps, and compactness.
    The complete source scope, including all geometric extensions, remains the objective.
