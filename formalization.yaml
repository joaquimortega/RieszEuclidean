techniques:
- name: Concrete Euclidean exponential synthesis
  status: implemented definitions
  description: EuclideanSpace over Fin d, restricted Lebesgue L² and a continuous linear equivalence from
    ℓ² of the actual frequency set. Standard coordinate vectors must equal exp(2πi inner(ξ,x)) almost
    everywhere.
  files:
  - RieszEuclidean/Basic.lean
- name: Projection gap and moving comparison
  status: proved conditional operator lemmas
  description: The norm gap below one is equivalent to an invertible restriction between projection ranges.
    Strictly included ranges cannot both satisfy this gap relative to one projection. Uniform gaps survive
    simultaneous strong limits, and norm convergence of the comparison family supplies the common boundary
    projection. The paper-specific families and their final contradiction are proved downstream.
  files:
  - RieszEuclidean/ProjectionGap.lean
  - RieszEuclidean/MovingComparison.lean
- name: Beurling local matching
  status: compact metrizable configuration space and continuous real action proved
  description: Weak convergence is defined by two-sided matching on every bounded ball. The proof uses
    metric triangle inequalities to retain the separation constant. Real translation invariance
    is proved for arbitrary configurations.
  files:
  - RieszEuclidean/Basic.lean
  - RieszEuclidean/WeakLimits.lean
- name: Affine transport of actual synthesis
  status: proved
  description: A measurable equivalence with finite nonzero constant Jacobian induces an L² equivalence.
    Unit-modulus coefficient weights and reindexing give an ℓ² isometry. For an arbitrary invertible affine
    map, the inverse absolute determinant gives the measure factor and the real adjoint gives the transpose
    frequency map. The 2π phase identity transports the exact synthesis columns.
  files:
  - RieszEuclidean/L2Transport.lean
  - RieszEuclidean/Affine.lean
- name: Euclidean Fourier and bump projections
  status: initial Fourier constructions, normalized bumps and initial gap proved
  description: Bilinear Fubini and Schwartz inversion prove Parseval. Compact-support smooth
    approximation and an explicit L² estimate prove Schwartz density. The Fourier isometry on
    this dense subspace extends continuously; norm preservation and closed dense range give
    a unitary map. Its inverse supplies the positive-sign convention. Indicator multiplication
    on actual L² representatives is an orthogonal projection, and unitary conjugation gives
    the Fourier cutoff. Schwartz test pairings and uniqueness for locally integrable functions
    prove L¹∩L² integral agreement for both signs. Fourier transposition with phased domain
    indicators gives the convolution kernel for every L¹∩L² input. Haar translation invariance
    gives cutoff commutation first on L¹∩L², then density extends it to all L². A lower
    synthesis-column bound and a uniform phase estimate prove frequency separation. Smooth
    radial bumps are converted to Schwartz functions and normalized in actual Euclidean L².
    A phase perturbation estimate gives a positive uniform Fourier lower bound after choosing
    the radius small enough. Separation makes distinct translated supports disjoint, proving
    orthonormality in actual Euclidean L². Orthogonal-family summation constructs isometric
    synthesis V, and V composed with its adjoint is the orthogonal range projection.
    The exact Fourier formula for translated bumps, bounded invertible multiplication and
    contraction from ambient L² to the restricted domain measure are constructed.
    Equality on coordinate vectors and continuity establish the synthesis identity on all
    square-summable coefficients. Zero extension identifies the domain projection range;
    unitary conjugation identifies the Fourier projection range. The synthesis identity
    induces a range isomorphism, and the projection-gap theorem gives distance less than one.
  files:
