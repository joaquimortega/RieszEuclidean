  verification_log: reviews/comparator-bochner.txt
  input_hashes: reviews/comparator-bochner-hashes.json
  verified_scope: Thirty-seven results covering the supporting interfaces, the actual
    averaging gap, conditional geometric interfaces, scalar spectral-measure existence for
    strongly continuous unitary representations on separable complex Hilbert spaces, and
    unconditional ball, noncollinear-triangle, affine-ellipsoid, general-boundary and
    supporting-halfspace polygon conclusions. The polygon results assume a finite irredundant
    presentation with nonzero normals and nonempty faces, and cover an unpaired maximal side
    and the odd-maximal-side consequence. The broader abstract positive-definite-function
    form of Bochner's theorem is outside the claimed scope.
