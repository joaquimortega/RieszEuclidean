  - RieszEuclidean/FiniteFilters.lean
  - RieszEuclidean/StationaryCutoffs.lean
- name: Covariant comparison kernel and averaged forms
  status: kernel identities, configuration continuity and stationary operator identities proved; averaging pending
  description: The actual subtype-indexed bump series has at most one active term under
    the support and separation assumptions. This gives summability, uniform bounds,
    finite propagation, covariance and Hermitian symmetry. Translated bump orthogonality
    proves product integrability and the projection integral identity. Local finite sums
    prove joint spatial continuity, including the configuration variable. The stationary
    operators M_t are self-adjoint, idempotent and operator-norm Lipschitz. The averaged
    scalar argument remains pending and introduces no amplified Hilbert space.
  files:
  - RieszEuclidean/BumpKernel.lean
  - RieszEuclidean/BumpKernelProjection.lean
  - RieszEuclidean/BumpKernelContinuity.lean
- name: Geometric boundary crossing
  status: sphere geometry proved; boundary limits and crossing remain conditional/pending
  description: Literal finite-positive Hausdorff sphere surface measure and translated-overlap nullity
    are proved. Boundary-cutoff limits and the sphere obstruction are assembled conditional on explicit
    spectral data and the averaged gap. Continuous averaging, same-direction edge crossing and the full
    ball, triangle, unpaired/odd polygon, ellipsoid and general-boundary conclusions remain pending.
