- name: Geometric boundary crossing
  status: geometry and unconditional domain conclusions proved and audited
  description: Literal finite-positive Hausdorff sphere surface measure and translated-overlap nullity
    are proved. Boundary jumps, same-direction edge crossing and the actual averaging gap assemble the
    ball, every noncollinear triangle, affine ellipsoid, general-boundary and finite irredundant
    supporting-halfspace polygon with nonzero normals, nonempty faces and an unpaired maximal side
    conclusions. The polygon presentation identifies supporting faces with maximal boundary segments and
    yields the odd-side result. Physical translation spectra and the interval/rectangle overlap remarks are
    formalized. The unconditional wrappers use the proved stationary hull spectral family.
