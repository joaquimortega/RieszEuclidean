fidelity:
  divergences: >-
    No alternate lattice proof is substituted for the Euclidean proof. The basis
    predicate uses actual restricted Lebesgue L² and exp(2πi inner(ξ,x)).
    Mathlib conjugates the first inner-product argument. The complete source
    scope, including all geometric extensions, remains the objective.
