- name: Continuous Fejer approximation and stationary cutoffs
  status: Fejer construction proved; cutoff construction proved given representing spectral measures
  description: Actual coordinate-box overlaps give compactly supported weights. Their Fourier
    transforms are normalized squared box transforms; Plancherel proves unit mass. Dilation
    reduces concentration to integrable tails. The Fourier symbol of the weighted domain
    kernel is exactly the smoothed domain indicator, bounded between zero and one and
    converging off the frontier. Tonelli gives a measurable conull good-parameter set.
    Scalar dominated convergence gives pointwise Cauchy finite filters. Uniform bounds
    construct a strong operator limit, and composition and adjoint identities prove
    self-adjointness and idempotence. A simultaneous family has spectral mass and difference
    identities. All limits use real radii tending to infinity; representing measures and
    common domination remain explicit hypotheses while Bochner existence is postponed.
  files:
  - RieszEuclidean/FejerWeights.lean
  - RieszEuclidean/BoxOverlap.lean
  - RieszEuclidean/FejerKernel.lean
  - RieszEuclidean/FejerConcentration.lean
  - RieszEuclidean/ApproximateCutoffs.lean
  - RieszEuclidean/SmoothedFejer.lean
