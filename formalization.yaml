- name: Stationary compact hull and scalar Bochner measures
  status: stationary system and vague equivalence proved; scalar Bochner measures pending
  description: Simultaneous Hausdorff subsequence extraction on integer-radius compact windows
    is proved, together with inclusion and interior compatibility of the window limits.
    Hausdorff convergence preserves separation and gives uniform two-sided point matching.
    The window limits assemble into a Beurling weak limit, proving subsequence extraction
    for every uniformly separated sequence while preserving its separation constant.
    Extended distances at a countable dense set induce a metrizable topology; its convergence
    is equivalent to Beurling local matching. Sequential compactness yields compactness, and
    moving-translation convergence yields joint continuity of the real action.
    Closedness, countability, finiteness in compact regions and uniform counting bounds
    are proved for separated configurations. The configuration counting measure is finite on
    compact sets. Local matching is preserved under convergent translation vectors.
    The compact orbit closure carries the restricted continuous action. Actual Euclidean
    boxes have volume (2R)^d, and normalized box averages are positive and have norm at most
    one. A fixed translation changes a box only within a fixed-thickness shell whose
    relative volume tends to zero. Integral symmetric-difference bounds yield vanishing
    translation error. Banach-Alaoglu supplies an invariant weak-star cluster functional;
    Riesz-Markov-Kakutani gives an invariant probability measure. The full construction
    is proved for continuous Euclidean actions and specialized to the paper's translation
    hull. The Koopman operators use pullback by T_{-z} to realize the manuscript
    convention U_z f(Γ)=f(Γ+z). They form a strongly continuous unitary representation
    on the separable stationary L² space, with invariant unit constant. Finite injective
    point matchings control test integrals and prove weak-to-vague convergence. Compactly
    supported bumps separate configurations; the continuous counting-test map is then an
    embedding by compactness, proving the converse. Actual hull correlations are continuous
    and positive definite. Fourier-character uniqueness determines representing measures
    and their total mass. The invariant constant has Dirac spectrum at zero; spectral
    parallelogram and homogeneity identities hold when representing measures are supplied.
    Strongly continuous unitary orbits admit L¹ integrated operators with the expected
    norm bound. Their squared norm is the iterated integral of the correlation Gram kernel.
    Absolute product integrability and Fourier-character factorization justify both
    Fubini exchanges and give the spectral norm identity for a supplied representing
    measure. The symbol equals the positive Euclidean Fourier transform, and its
    square is integrable against every finite spectral measure.
    Kernel involution gives the operator adjoint and conjugates the Fourier symbol.
    The integrable convolution kernel permits Fubini; convolution composes operators
    and multiplies symbols. These algebra identities are proved without spectral
    measure existence. Separability gives a dense sequence of normalized vectors. Positive
    summable weights form a probability control measure; homogeneity, the parallelogram
    estimate and vector approximation prove domination of every spectral measure. The
    spectral norm identity proves the uniform symbol operator bound. Both results retain
    the supplied representing family; general Bochner measure existence is postponed.
