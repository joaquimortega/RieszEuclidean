fidelity:
  divergences: The basis predicate uses actual restricted Lebesgue L² and
    exp(2πi inner(ξ,x)); Mathlib conjugates the first inner-product argument.
    Hull compactness uses Hausdorff limits on compact Euclidean windows and
    countable extended-distance probes, and its topology is proved equivalent
    to Beurling local matching and vague counting-measure convergence. The
    Bochner theorem is formalized for scalar correlations of strongly continuous
    unitary representations on separable complex Hilbert spaces. Polygon results
    use finite irredundant supporting-halfspace presentations with nonzero normals
    and nonempty faces.
