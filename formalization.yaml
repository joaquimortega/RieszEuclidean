techniques:
- name: Concrete Euclidean exponential synthesis
  status: implemented definitions
  description: EuclideanSpace over Fin d, restricted Lebesgue L² and a continuous linear equivalence from
    ℓ² of the actual frequency set. Standard coordinate vectors must equal exp(2πi inner(ξ,x)) almost
    everywhere. No lattice or rounded frequencies occur.
  files:
  - RieszEuclidean/Basic.lean
- name: Projection gap and moving comparison
  status: proved conditional operator lemmas
  description: The norm gap below one is equivalent to an invertible restriction between projection ranges.
    Strictly included ranges cannot both satisfy this gap relative to one projection. Uniform gaps survive
    simultaneous strong limits, and norm convergence of the comparison family supplies the common boundary
    projection. Construction of the paper-specific families remains open.
  files:
  - RieszEuclidean/ProjectionGap.lean
  - RieszEuclidean/MovingComparison.lean
- name: Beurling local matching
  status: compact metrizable configuration space and continuous real action proved
  description: Weak convergence is defined by two-sided matching on every bounded ball. The proof uses
    metric triangle inequalities to retain the original separation constant. Real translation invariance
    is proved without identifying sets with lattice patterns.
  files:
  - RieszEuclidean/Basic.lean
  - RieszEuclidean/WeakLimits.lean
- name: Affine transport of actual synthesis
  status: proved
  description: A measurable equivalence with finite nonzero constant Jacobian induces an L² equivalence.
    Unit-modulus coefficient weights and reindexing give an ℓ² isometry. For an arbitrary invertible affine
    map, the inverse absolute determinant gives the measure factor and the real adjoint gives the transpose
    frequency map. The 2π phase identity transports the exact synthesis columns.
  files:
  - RieszEuclidean/L2Transport.lean
  - RieszEuclidean/Affine.lean
- name: Euclidean Fourier and bump projections
  status: initial Fourier constructions, normalized bumps and initial gap proved
  description: Bilinear Fubini and Schwartz inversion prove Parseval. Compact-support smooth
    approximation and an explicit L² estimate prove Schwartz density. The Fourier isometry on
    this dense subspace extends continuously; norm preservation and closed dense range give
    a unitary map. Its inverse supplies the positive-sign convention. Indicator multiplication
    on actual L² representatives is an orthogonal projection, and unitary conjugation gives
    the Fourier cutoff. Schwartz test pairings and uniqueness for locally integrable functions
    prove L¹∩L² integral agreement for both signs. Fourier transposition with phased domain
    indicators gives the convolution kernel for every L¹∩L² input. Haar translation invariance
    gives cutoff commutation first on L¹∩L², then density extends it to all L². A lower
    synthesis-column bound and a uniform phase estimate prove frequency separation. Smooth
    radial bumps are converted to Schwartz functions and normalized in actual Euclidean L².
    A phase perturbation estimate gives a positive uniform Fourier lower bound after choosing
    the radius small enough. Separation makes distinct translated supports disjoint, proving
    orthonormality in actual Euclidean L². Orthogonal-family summation constructs isometric
    synthesis V, and V composed with its adjoint is the orthogonal range projection.
    The exact Fourier formula for translated bumps, bounded invertible multiplication and
    contraction from ambient L² to the restricted domain measure are constructed.
    Equality on coordinate vectors and continuity establish the synthesis identity on all
    square-summable coefficients. Zero extension identifies the domain projection range;
    unitary conjugation identifies the Fourier projection range. The synthesis identity
    induces a range isomorphism, and the projection-gap theorem gives distance less than one.
  files:
  - RieszEuclidean/FourierL2.lean
  - RieszEuclidean/SchwartzDensity.lean
  - RieszEuclidean/FourierExtension.lean
  - RieszEuclidean/CutoffProjection.lean
  - RieszEuclidean/FourierAgreement.lean
  - RieszEuclidean/FourierKernel.lean
  - RieszEuclidean/FourierTranslations.lean
  - RieszEuclidean/Separation.lean
  - RieszEuclidean/Bumps.lean
  - RieszEuclidean/BumpFourier.lean
  - RieszEuclidean/BumpTranslates.lean
  - RieszEuclidean/BumpSynthesis.lean
  - RieszEuclidean/BumpTransform.lean
  - RieszEuclidean/L2Multiplier.lean
  - RieszEuclidean/BumpMultiplier.lean
  - RieszEuclidean/DomainRestriction.lean
  - RieszEuclidean/BumpIdentity.lean
  - RieszEuclidean/DomainExtension.lean
  - RieszEuclidean/FourierRange.lean
  - RieszEuclidean/RangeIso.lean
  - RieszEuclidean/InitialGap.lean
- name: Stationary compact hull and scalar Bochner measures
  status: stationary system and vague equivalence proved; scalar Bochner measures pending
  description: Simultaneous Hausdorff subsequence extraction on integer-radius compact windows
    is proved, together with inclusion and interior compatibility of the window limits.
    Hausdorff convergence preserves separation and gives uniform two-sided point matching.
    The window limits assemble into a Beurling weak limit, proving subsequence extraction
    for every uniformly separated sequence while preserving its separation constant.
    Extended distances at a countable dense set induce a metrizable topology; its convergence
    is equivalent to Beurling local matching. Sequential compactness yields compactness, and
    moving-translation convergence yields joint continuity of the real action.
    Closedness, countability, finiteness in compact regions and uniform counting bounds
    are proved for separated configurations. The configuration counting measure is finite on
    compact sets. Local matching is preserved under convergent translation vectors.
    The compact orbit closure carries the restricted continuous action. Actual Euclidean
    boxes have volume (2R)^d, and normalized box averages are positive and have norm at most
    one. A fixed translation changes a box only within a fixed-thickness shell whose
    relative volume tends to zero. Integral symmetric-difference bounds yield vanishing
    translation error. Banach-Alaoglu supplies an invariant weak-star cluster functional;
    Riesz-Markov-Kakutani gives an invariant probability measure. The full construction
    is proved for continuous Euclidean actions and specialized to the paper's translation
    hull. The Koopman operators use pullback by T_{-z} to realize the manuscript
    convention U_z f(Γ)=f(Γ+z). They form a strongly continuous unitary representation
    on the separable stationary L² space, with invariant unit constant. Finite injective
    point matchings control test integrals and prove weak-to-vague convergence. Compactly
    supported bumps separate configurations; the continuous counting-test map is then an
    embedding by compactness, proving the converse. Construct finite spectral measures on ℝⁿ from continuous
    positive-definite correlations, their common control measure and the Dirac spectrum of the invariant
    constant.
  files:
  - RieszEuclidean/WindowWeakLimit.lean
  - RieszEuclidean/DistanceProfile.lean
  - RieszEuclidean/ConfigurationTopology.lean
  - RieszEuclidean/ConfigurationMeasure.lean
  - RieszEuclidean/TranslationHull.lean
  - RieszEuclidean/PositiveFunctionalMeasure.lean
  - RieszEuclidean/CompactMeans.lean
  - RieszEuclidean/MeanRepresentation.lean
  - RieszEuclidean/EuclideanBoxes.lean
  - RieszEuclidean/BoxAverages.lean
  - RieszEuclidean/BoxBoundary.lean
  - RieszEuclidean/IntegralSymmDiff.lean
  - RieszEuclidean/BoxTranslationIntegral.lean
  - RieszEuclidean/InvariantProbability.lean
  - RieszEuclidean/HullInvariantMeasure.lean
  - RieszEuclidean/Koopman.lean
  - RieszEuclidean/VagueConvergence.lean
- name: Continuous cutoffs, kernels and averaged forms
  status: planned; not yet formalized
  description: Continuous Fejér kernels and dominated convergence give cutoff projections. A compactly
    supported covariant bump kernel gives orthogonal projections M_t continuous in norm. Apply the original
    gap to compactly supported test functions and integrate scalar pairings; no amplified Hilbert space
    is introduced.
- name: Geometric boundary crossing
  status: planned; not yet formalized
  description: Prove sphere surface-measure overlap nullity and same-direction edge crossing, construct
    the strong cutoff limits and use the invariant constant for strict inclusion. Retain the full ball,
    triangle, unpaired/odd polygon, ellipsoid and general-boundary scope.
