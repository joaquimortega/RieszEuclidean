    initial bump projections, the compact hull, stationary probability and Koopman system,
    and continuous Fejer approximation. Given representing spectral measures, the control
    measure and actual stationary cutoff family are proved. Scalar spectral measures are constructed
    for strongly continuous unitary representations on separable complex Hilbert spaces, the exact
    Bochner scope used by the manuscript. The modules implement the actual averaging gap and ball,
    triangle, ellipsoid, general-boundary and finite irredundant supporting-halfspace polygon
    conclusions with nonzero normals and nonempty faces, together
    with physical translation spectra and the interval/rectangle remarks. The
    unconditional wrappers discharge the stationary representation hypotheses. The independent
    public-statement and transitive-axiom audit is complete.
